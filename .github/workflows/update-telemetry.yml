name: Update Engineering Telemetry SVG

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_telemetry.py"
      - ".github/workflows/update-telemetry.yml"

permissions:
  contents: write

concurrency:
  group: profile-telemetry-svg
  cancel-in-progress: true

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate light & dark telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_telemetry.py

      - name: Commit updated SVG plates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-light.svg assets/telemetry-dark.svg
          if git diff --cached --quiet; then
            echo "Telemetry SVGs are already up to date."
          else
            git commit -m "chore(telemetry): refresh unified GitHub activity SVGs [skip ci]"
            git push
          fi
